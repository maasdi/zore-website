name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate content and browser script
        run: |
          python tests/validate_content.py
          node --check public/assets/site.js
      - name: Build production image and shutdown fixture
        run: |
          docker build --platform linux/amd64 --target release --build-arg SOURCE_REVISION="$GITHUB_SHA" -t zore-website:validated .
          docker build --platform linux/amd64 --target smoke-fixture --build-arg SOURCE_REVISION="$GITHUB_SHA" -t zore-website:shutdown .
      - name: Exercise tested runtime image
        env:
          BROWSER_PATH: /usr/bin/google-chrome
        run: python tests/smoke.py --browser
      - name: Upload runtime and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            .artifacts/browser
            .artifacts/smoke.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Archive the tested production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .artifacts/runtime-image
          docker save zore-website:validated | gzip -n > .artifacts/runtime-image/image.tar.gz
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          destination = Path('.artifacts/runtime-image')
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'zore-website:validated'], text=True))[0]
          metadata = {'image_id': image['Id'], 'source_commit': os.environ['GITHUB_SHA'], 'compiler_version': image['Config']['Labels']['dev.zore.compiler.version']}
          (destination / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          with (destination / 'image.tar.gz').open('rb') as source:
              checksum = hashlib.file_digest(source, 'sha256').hexdigest()
          (destination / 'image.tar.gz.sha256').write_text(checksum + '  image.tar.gz\n', encoding='utf-8')
          PY
          python tests/verify_runtime_image.py --archive .artifacts/runtime-image/image.tar.gz --checksum .artifacts/runtime-image/image.tar.gz.sha256 --metadata .artifacts/runtime-image/metadata.json --expected-commit "$GITHUB_SHA"
      - name: Retain the tested production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-image-${{ github.sha }}
          path: .artifacts/runtime-image
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
